<uiView triggerBacklight="true">
  <div id="suuntoplus" class="cm-bg"
    style="position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;">

    <!-- App name in the accent color used by other Suunto apps; no stripe. -->
    <div class="sp-t-s sp-c-orange" style="top:7%;left:10%;width:80%;text-align:center;">{{title}}</div>

    <!-- State text sits above the timer so the timer can use the full width.
         The watch renderer does not keep inline simulator layout. -->
    <div id="state_text" class="sp-t-s cm-mid" style="top:16%;left:10%;width:80%;text-align:center;">WAIT</div>
    <div class="sp-d-xl f-num" style="top:25%;left:10%;width:80%;text-align:center;">
      <eval input="/Zapp/{zapp_index}/Output/display_timer" outputFormat="Duration_FourdigitsFixed" default="0'00"/>
    </div>

    <!-- Counters also use explicit positions so they stay horizontal on the watch. -->
    <div class="sp-t-s cm-mid" style="top:67%;left:10%;width:12%;text-align:center;">{{exercise}}</div>
    <div class="sp-t-s f-num" style="top:67%;left:22%;width:10%;text-align:center;">
      <eval input="/Zapp/{zapp_index}/Output/exercise" outputFormat="Count_Fourdigits" default="0"/>
    </div>

    <div class="sp-t-s cm-mid" style="top:67%;left:36%;width:17%;text-align:center;">{{sets}}</div>
    <div class="sp-t-s f-num" style="top:67%;left:53%;width:9%;text-align:center;">
      <eval input="/Zapp/{zapp_index}/Output/exercise_sets" outputFormat="Count_Fourdigits" default="0"/>
    </div>

    <div class="sp-t-s cm-mid" style="top:67%;left:65%;width:17%;text-align:center;">TOT</div>
    <div class="sp-t-s f-num" style="top:67%;left:82%;width:8%;text-align:center;">
      <eval input="/Zapp/{zapp_index}/Output/total_sets" outputFormat="Count_Fourdigits" default="0"/>
    </div>

    <!-- Button handling. Controls are documented in the store description,
         not repeated on screen during a workout. -->
    <:if test="{{ HAS_ON_EVENT }}">
      <userInput>
        <pushButton name="down"
          onClick="$.put('/Zapp/{zapp_index}/Event', 1, null, 'int32');"
          onLongPressStart="$.put('/Zapp/{zapp_index}/Event', 1, null, 'int32');"
          longPressDuration="1" />
        <pushButton name="up"
          longType="action"
          longPressDuration="1"
          onLongPressStart="$.put('/Zapp/{zapp_index}/Event', 2, null, 'int32');"
          onLongPressFull="$.put('/Zapp/{zapp_index}/Event', 2, null, 'int32');"
          onLongPress="$.put('/Zapp/{zapp_index}/Event', 2, null, 'int32');" />
      </userInput>
    </:if>

  </div>
</uiView>
